[project]
name = "f1-pace-lab"
version = "0.1.0"
description = "Weekend pace analysis for Formula 1 using OpenF1 data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pacelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
